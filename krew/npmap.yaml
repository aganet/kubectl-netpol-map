apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: npmap
spec:
  version: v0.1.1
  homepage: https://github.com/aganet/kubectl-npmap
  shortDescription: Show what NetworkPolicies allow and deny, and why A can't reach B
  description: |
    kubectl-npmap reads the standard and Cilium NetworkPolicies in a cluster,
    or in a folder of manifests, and shows what they allow and deny: a policy
    map and trace in a local web UI, a k9s-style terminal UI, and CLI commands
    for a reachability matrix, a layered trace of one connection (DNS, Service,
    port, policy, mesh), a what-if diff of a policy manifest, and a lint. It
    only reads the cluster.
  platforms:
    - selector: {matchLabels: {os: darwin, arch: arm64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_darwin_arm64.tar.gz
      sha256: 4c490145425da5ccddc9106a137c3c0ee17dd05a6609957884cd46f0be5f191b
      bin: kubectl-npmap
    - selector: {matchLabels: {os: darwin, arch: amd64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_darwin_amd64.tar.gz
      sha256: 725b1a8ce4453a0db8b336f126d545a04bf079e020df666ddc3225af48b7937c
      bin: kubectl-npmap
    - selector: {matchLabels: {os: linux, arch: amd64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_linux_amd64.tar.gz
      sha256: 8572cb72084fcedf26e068b5b9bbb8b7846c7095062d9cb4cb3d5d993752f04f
      bin: kubectl-npmap
    - selector: {matchLabels: {os: linux, arch: arm64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_linux_arm64.tar.gz
      sha256: f842b91404f64c1daad37bc61f86a3c31a29505cc8f97f65843bec64e02e9600
      bin: kubectl-npmap
    - selector: {matchLabels: {os: windows, arch: amd64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_windows_amd64.zip
      sha256: 23da61c3026cedf820272b4cac04bace6addbb373a13a2d0ee7996850a53ec49
      bin: kubectl-npmap.exe
    - selector: {matchLabels: {os: windows, arch: arm64}}
      uri: https://github.com/aganet/kubectl-npmap/releases/download/v0.1.1/kubectl-npmap_0.1.1_windows_arm64.zip
      sha256: 0f236d1cc158fda95204fb817f18be2d70ef72afef80faf9998cacf1df1bfeb6
      bin: kubectl-npmap.exe
