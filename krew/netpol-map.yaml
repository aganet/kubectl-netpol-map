apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: netpol-map
spec:
  version: v0.3.1
  homepage: https://github.com/aganet/kubectl-netpol-map
  shortDescription: Show what NetworkPolicies allow and deny
  description: |
    kubectl-netpol-map reads the standard and Cilium NetworkPolicies in a
    cluster, or in a folder of manifests, and shows what they allow and deny
    and why A can't reach B: a policy map and trace in a local web UI, a
    k9s-style terminal UI, and CLI commands for a reachability matrix, a
    layered trace of one connection (DNS, Service, port, policy, mesh), a
    what-if diff of a policy manifest, and a lint. It only reads the cluster.
  platforms:
    - selector: {matchLabels: {os: darwin, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_darwin_arm64.tar.gz
      sha256: 35430542899a81df51716d69ddd73ab2fbbf0a4c0023639080b6b3dbe32f290e
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: darwin, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_darwin_amd64.tar.gz
      sha256: 63c460c59d6ae934c47bb8156f33d1e9eba36dbfaf00182935ea74e1917c4621
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: linux, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_linux_amd64.tar.gz
      sha256: 29dfc404cdb84f225cd19fdb649ca1bb1922162949cb5d5cc30b257d95093043
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: linux, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_linux_arm64.tar.gz
      sha256: d78e533f8c51b0bcbd69c710fc8c6bc65039d111edacdb8baf7f889d0b47e888
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: windows, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_windows_amd64.zip
      sha256: 009543e5a52c56cb745e40a0f3dc12f88158ccdf53573a61fd61e280e37af2d2
      bin: kubectl-netpol_map.exe
    - selector: {matchLabels: {os: windows, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.1/kubectl-netpol-map_0.3.1_windows_arm64.zip
      sha256: 920a45ddd622334bb3b28b8e6448db0077d188475897e8dcd550f0852bd75e1a
      bin: kubectl-netpol_map.exe
