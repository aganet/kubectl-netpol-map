apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: netpol-map
spec:
  version: v0.3.0
  homepage: https://github.com/aganet/kubectl-netpol-map
  shortDescription: Show what NetworkPolicies allow and deny
  description: |
    kubectl-netpol-map reads the standard and Cilium NetworkPolicies in a
    cluster, or in a folder of manifests, and shows what they allow and deny
    and why A can't reach B: a policy map and trace in a local web UI, a
    k9s-style terminal UI, and CLI commands for a reachability matrix, a
    layered trace of one connection (DNS, Service, port, policy, mesh), a
    what-if diff of a policy manifest, and a lint. It only reads the cluster.
  platforms:
    - selector: {matchLabels: {os: darwin, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_darwin_arm64.tar.gz
      sha256: 2853fe66622207c2d4d937a9762c0661a27561a87be9e54f5b159e139a2d0214
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: darwin, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_darwin_amd64.tar.gz
      sha256: dedf940e8779e5f570f0acc7156e160c9568e1d3b37aa1b4f012609f73b103e0
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: linux, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_linux_amd64.tar.gz
      sha256: 4afdb95fc8e07255094c5755b23f10d66a00d08bb52856e575b26fbcc833513d
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: linux, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_linux_arm64.tar.gz
      sha256: d0a3cae6e84bfaa8437ee9d9417ed3d19fbd2c8fb36c2e1d270e62104172f59c
      bin: kubectl-netpol_map
    - selector: {matchLabels: {os: windows, arch: amd64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_windows_amd64.zip
      sha256: 233c67c93bde52db3014365561c3963835809af2c2bcc8e8531fd7eccaea55e7
      bin: kubectl-netpol_map.exe
    - selector: {matchLabels: {os: windows, arch: arm64}}
      uri: https://github.com/aganet/kubectl-netpol-map/releases/download/v0.3.0/kubectl-netpol-map_0.3.0_windows_arm64.zip
      sha256: 58ab94a43a4c1fb5339bd989ccbf1d62bc66cb43f3cc63d57d4a43d8840f1367
      bin: kubectl-netpol_map.exe
