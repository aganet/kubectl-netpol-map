<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netpol-map</title>
<style>
  :root {
    --bg: #f7f7f8; --bg-2: #ffffff; --panel: #ffffff; --panel-2: #f3f4f6; --border: #e2e4e8; --border-2: #cfd3d9;
    --text: #1b1f24; --muted: #5b6370; --accent: #3b5bdb; --accent-fg: #ffffff; --accent-soft: #e8edfb;
    --ok: #137a3a; --ok-soft: #dcf5e4; --warn: #9a5a00; --warn-soft: #fff1cf;
    --fail: #c22424; --fail-soft: #fde2e2; --skip: #8a919c; --skip-soft: #eef0f3;
    --map-bg: #ffffff; --grid: #e6e8ec;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --radius: 10px; --shadow: 0 2px 4px rgba(11,26,51,.08), 0 14px 32px -12px rgba(11,26,51,.35);
  }
  :root[data-theme="dark"] {
    --bg: #161616; --bg-2: #1c1c1c; --panel: #202020; --panel-2: #2a2a2a; --border: #343434; --border-2: #444444;
    --text: #f2f2f2; --muted: #a8adb5; --accent: #8fa6ff; --accent-fg: #101010; --accent-soft: #2c3350;
    --ok: #5ee08f; --ok-soft: #163a25; --warn: #ffc857; --warn-soft: #3d2d0a;
    --fail: #ff7b7b; --fail-soft: #41191a; --skip: #7a7f88; --skip-soft: #2a2a2a;
    --map-bg: #1a1a1a; --grid: #262626;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -18px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  button, input { font: inherit; color: inherit; }
  code, .mono { font-family: var(--mono); font-size: 13px; }
  a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  a:hover { filter: brightness(.85); }

  .top { display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 52px; border-bottom: 1px solid var(--border); background: var(--bg-2); position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -.01em; margin-right: 6px; }
  .brand svg { width: 24px; height: 24px; color: var(--accent); }
  .tabs { display: flex; gap: 2px; height: 100%; }
  .tab { padding: 0 14px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .pill b { color: var(--text); font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .pill.warn, .pill.unknown { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .pill.fail { color: var(--fail); background: var(--fail-soft); border-color: transparent; }
  .pill.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
  .pill.click { cursor: pointer; }
  .stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--panel); cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: var(--panel-2); border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; padding: 9px 16px; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  .btn.icon { padding: 6px 9px; }

  main { padding: 16px 18px 60px; max-width: 1500px; margin: 0 auto; }
  .panel { display: none; } .panel.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card h3 { margin: 0 0 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .field { margin-bottom: 10px; } .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
  .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); padding: 6px 12px; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .error { padding: 10px 14px; border-radius: 8px; background: var(--fail-soft); color: var(--fail); margin-bottom: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 36px 0; }
  .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .field { margin: 0; min-width: 190px; }
  input[type=number], input[type=search] { padding: 8px 11px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--panel); outline: none; }
  .maptools { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; padding-bottom: 6px; }
  .maptools input[type=range] { width: 110px; vertical-align: middle; accent-color: var(--accent); }
  input:focus { border-color: var(--accent); }
  .toolbar input[type=number] { width: 110px; }
  .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); padding-bottom: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .legend { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; margin-left: auto; padding-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 22px; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .legend label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
  .legend label input { margin: 0 2px 0 0; accent-color: var(--accent); }
  .legend .allow { border-color: var(--ok); } .legend .deny { border-color: var(--fail); border-top-style: dashed; } .legend .partial { border-color: var(--warn); } .legend .unknown { border-color: var(--warn); border-top-style: dotted; } .legend .blocked { border-color: var(--warn); border-top-style: dashed; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: var(--skip-soft); color: var(--muted); letter-spacing: .04em; }
  .badge.i, .badge.e { background: var(--accent-soft); color: var(--accent); }
  .badge.deny { background: var(--fail-soft); color: var(--fail); } .badge.l7 { background: var(--warn-soft); color: var(--warn); }
  .badge.std { background: var(--skip-soft); color: var(--text); } .badge.cil { background: #d9f4f0; color: #0f766e; }
  :root[data-theme="dark"] .badge.cil { background: #1f3a3a; color: #5fd3c7; }

  /* searchable select */
  .picker { position: relative; }
  .picker-btn { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 11px; border: 1px solid var(--border-2); border-radius: 8px; background: var(--panel); cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s; }
  .picker-btn:hover { border-color: var(--accent); }
  .picker.open .picker-btn { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .picker-btn.empty .picker-label { color: var(--muted); }
  .picker-btn:disabled { opacity: .5; cursor: default; }
  .picker-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-hint { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .chev { color: var(--muted); font-size: 10px; }
  .picker-pop { position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 30; background: var(--panel); border: 1px solid var(--border-2); border-radius: 9px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 320px; overflow: hidden; }
  .picker-pop[hidden] { display: none; }
  .picker-pop input { width: 100%; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; padding: 9px 11px; }
  .picker-list { overflow: auto; padding: 4px; }
  .picker-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 9px; border-radius: 6px; cursor: pointer; }
  .picker-item .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .picker-item.active, .picker-item:hover { background: var(--accent-soft); }
  .picker-item.custom { color: var(--accent); }
  .picker-empty { padding: 10px; color: var(--muted); text-align: center; }

  /* policy map, drawn like the Cilium editor: cards with rows and elbow connectors */
  :root { --ico: #2f6fb5; --edge-allow: #3f8f1f; --edge-deny: #d7453b; --edge-warn: #d99a06; }
  :root[data-theme="dark"] { --ico: #7fb0ec; --edge-allow: #5ec43a; --edge-deny: #ff6b5e; --edge-warn: #f5b942; }
  .map { position: relative; background: var(--map-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; height: 60vh; min-height: 400px;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  .map svg { display: block; }
  .map .cardbg { fill: var(--panel); stroke: var(--border-2); rx: 14; cursor: grab; filter: url(#cardShadow); }
  .map .cardbg.ext { stroke-dasharray: 5 4; }
  .map .colgroup.dragging { opacity: .8; } .map .colgroup.dragging .cardbg { cursor: grabbing; stroke: var(--accent); stroke-width: 2; }
  .map .hdr { font-size: 15px; font-weight: 700; fill: var(--text); pointer-events: none; }
  .map .hdrline { stroke: var(--border); }
  .map .node rect { fill: var(--panel); stroke: var(--border-2); rx: 6; cursor: pointer; transition: stroke .15s; }
  .map .node.dim { opacity: .45; }
  .map .node:hover rect, .map .node.focus rect { stroke: var(--accent); stroke-width: 2; }
  .map .node text { font-size: 14px; fill: var(--text); pointer-events: none; }
  .map .node .kind { font-size: 11px; fill: var(--muted); }
  .map .edge { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; cursor: pointer; }
  .map .edge.allow { stroke: var(--edge-allow); } .map .edge.deny { stroke: var(--edge-deny); stroke-dasharray: 7 5; stroke-width: 1.6; opacity: .7; }
  .map .edge.partial { stroke: var(--edge-warn); } .map .edge.unknown { stroke: var(--edge-warn); stroke-dasharray: 2 5; }
  .map .edge.blocked { stroke: var(--edge-warn); stroke-dasharray: 7 5; }
  .map .edge.rejected { stroke: var(--skip); stroke-dasharray: 3 5; } .map .stub.rejected { fill: var(--skip); }
  .map .edge:hover, .map .edge.hl { stroke-width: 4; opacity: 1; }
  .map .stub { rx: 2; pointer-events: none; }
  .map .stub.allow { fill: var(--edge-allow); } .map .stub.deny { fill: var(--edge-deny); } .map .stub.blocked, .map .stub.partial, .map .stub.unknown { fill: var(--edge-warn); }
  .map.focused .edge:not(.focus) { opacity: .08; } .map.focused .node:not(.focus) { opacity: .3; } .map.focused .stub { opacity: .25; }
  .flows { margin-top: 12px; max-height: 40vh; overflow: auto; }
  .tip { position: fixed; z-index: 40; pointer-events: none; background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); font-size: 12.5px; max-width: 460px; }
  .tip[hidden] { display: none; }
  .tip .t { font-weight: 600; margin-bottom: 2px; } .tip .r { color: var(--muted); } .tip .l { margin-top: 3px; }

  /* policies */
  .split { display: grid; grid-template-columns: 420px 1fr; gap: 12px; margin-top: 12px; align-items: start; }
  .plist { max-height: 60vh; overflow: auto; padding: 8px; }
  .pitem { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .pitem:hover { background: var(--panel-2); } .pitem.active { border-color: var(--accent); background: var(--accent-soft); }
  .pitem .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .meta { color: var(--muted); font-size: 12.5px; grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pitem .badges { display: flex; gap: 4px; }
  .detail { position: relative; min-height: 300px; background: var(--map-bg); background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 22px 22px; }
  .cols { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 64px; position: relative; z-index: 1; }
  .col h4 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; justify-content: space-between; }
  .ecard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px 12px; margin-bottom: 14px; }
  .ecard.deny { border-color: var(--edge-deny); }
  .rhdr { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; padding: 2px 2px 8px; }
  .rhdr .ico { width: 24px; height: 24px; flex: none; }
  .rhdr .sp { flex: 1; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--border-2); border-radius: 7px; padding: 8px 11px; margin-top: 7px; background: var(--panel); }
  .prow .m { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow-wrap: anywhere; margin-top: 2px; }
  .pb { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  .center { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; }
  .center .sel { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -4px 0 8px 33px; }
  .locks { display: flex; gap: 8px; margin: 4px 0 10px; flex-wrap: wrap; }
  .note { color: var(--muted); font-size: 12.5px; font-style: italic; padding: 8px 0; }
  .finding { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border-2); border-radius: 9px; padding: 9px 11px; margin-bottom: 8px; position: relative; z-index: 1; }
  .finding.warning { border-left-color: var(--edge-warn); } .finding.error { border-left-color: var(--edge-deny); }
  .connectors { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  .connectors path { fill: none; stroke-width: 2.4; stroke-linejoin: round; }
  .connectors .allow { stroke: var(--edge-allow); } .connectors .deny { stroke: var(--edge-deny); stroke-dasharray: 7 5; }
  .connectors .stub.allow { fill: var(--edge-allow); } .connectors .stub.deny { fill: var(--edge-deny); }

  /* trace */
  .form { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 14px; align-items: stretch; }
  .arrow { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 26px; }
  .actions { display: flex; align-items: center; gap: 12px; margin: 14px 0 18px; flex-wrap: wrap; }
  .cli { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 260px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; color: var(--muted); overflow: hidden; }
  .cli code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .verdict { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius); margin-bottom: 12px; border-left: 4px solid currentColor; }
  .verdict.pass { background: var(--ok-soft); color: var(--ok); } .verdict.warn { background: var(--warn-soft); color: var(--warn); } .verdict.fail { background: var(--fail-soft); color: var(--fail); }
  .verdict .big { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .verdict .sub { color: var(--text); opacity: .75; font-size: 12.5px; }
  .verdict .glyph { font-size: 26px; line-height: 1; }
  .layer { display: grid; grid-template-columns: 30px 124px 1fr; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--border); align-items: start; }
  .layer:first-child { border-top: 0; }
  .g { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .g.pass { background: var(--ok-soft); color: var(--ok); } .g.fail { background: var(--fail-soft); color: var(--fail); } .g.warn { background: var(--warn-soft); color: var(--warn); } .g.skip { background: var(--skip-soft); color: var(--skip); }
  .layer .n { font-weight: 600; padding-top: 2px; } .layer.skip .n, .layer.skip .s { color: var(--muted); }
  .layer .s { padding-top: 2px; overflow-wrap: anywhere; }
  .layer .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; font-family: var(--mono); }
  .fix { margin-top: 8px; padding: 9px 11px; border-radius: 8px; background: var(--panel-2); border: 1px dashed var(--border-2); white-space: pre-wrap; font-size: 12.5px; }
  .fix b { display: block; margin-bottom: 2px; }
  .layer.fail .fix { border-color: var(--fail); } .layer.warn .fix { border-color: var(--warn); }
  details { margin-top: 12px; } summary { cursor: pointer; color: var(--muted); user-select: none; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tr.hl td { background: var(--accent-soft); }

  @media (max-width: 960px) { .split, .cols { grid-template-columns: 1fr; } .form { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); } .layer { grid-template-columns: 30px 1fr; } .layer .s { grid-column: 2; } .stats { display: none; } .connectors { display: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ico-ns" viewBox="0 0 24 24" fill="none" stroke="var(--ico)" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></symbol>
  <symbol id="ico-globe" viewBox="0 0 24 24" fill="none" stroke="var(--ico)" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18M4.6 7.5h14.8M4.6 16.5h14.8"/></symbol>
  <symbol id="ico-cluster" viewBox="0 0 24 24" fill="var(--ico)"><circle cx="12" cy="12" r="2.3"/><circle cx="12" cy="4.5" r="2"/><circle cx="18.5" cy="8.2" r="2"/><circle cx="18.5" cy="15.8" r="2"/><circle cx="12" cy="19.5" r="2"/><circle cx="5.5" cy="15.8" r="2"/><circle cx="5.5" cy="8.2" r="2"/><path d="M12 7v3M15.5 9.5l-2 1.2M15.5 14.5l-2-1.2M12 17v-3M8.5 14.5l2-1.2M8.5 9.5l2 1.2" stroke="var(--ico)" stroke-width="1.2"/></symbol>
</svg>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.2 7.3l3.6 8.4M16.8 7.3l-3.6 8.4M7.5 6h9"/></svg>
    netpol-map
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="policies">Policies</button>
    <button class="tab" data-tab="trace">Trace</button>
  </nav>
  <div class="spacer"></div>
  <span class="stats" id="stats"></span>
  <span class="pill" id="ctx" title="kubeconfig context">…</span>
  <button class="btn icon" id="refresh" title="Re-read pods, Services and policies from the cluster">↻ <span>Refresh</span></button>
  <button class="btn icon" id="theme" title="Toggle light/dark">◐</button>
</header>

<main>
  <!-- Policies -->
  <section class="panel active" id="panel-policies">
    <div class="toolbar">
      <div class="field"><label>Namespace</label><div id="pNs"></div></div>
      <div class="field"><label>Search</label><input type="search" id="pSearch" placeholder="policy, workload, selector, peer…" style="min-width:260px"></div>
      <div class="field" style="min-width:0"><label>Port</label><input type="number" id="pPort" placeholder="any" min="1" max="65535" title="only draw rules and verdicts that cover this port"></div>
      <div class="seg" id="pKind" style="margin-bottom:1px"><button data-k="" class="active">All</button><button data-k="NetworkPolicy">Standard</button><button data-k="Cilium">Cilium</button></div>
      <label class="check"><input type="checkbox" id="pExt" checked> external peers</label>

    <div class="form">

</main>
<div class="tip" id="tip" hidden></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GLYPH = { pass: '✓', fail: '✗', warn: '!', skip: '–' };
const PILL = { allow: 'ok', deny: 'fail', partial: 'warn', unknown: 'unknown', blocked: 'warn', rejected: 'fail' };
const keyOf = (a) => `${a.ns}/${a.kind}/${a.name}`;
const tip = $('#tip');
const showTip = (ev, html) => { tip.hidden = false; tip.style.left = ev.clientX + 14 + 'px'; tip.style.top = ev.clientY + 14 + 'px'; tip.innerHTML = html; };
const hideTip = () => { tip.hidden = true; };

/* ---------- searchable select ---------- */
class Picker {
  constructor(el, { placeholder = 'Select…', onChange = () => {}, custom = null } = {}) {
    Object.assign(this, { el, placeholder, onChange, custom, options: [], value: null, active: 0 });
    el.classList.add('picker');
    el.innerHTML = `<button type="button" class="picker-btn empty"><span class="picker-label"></span><span class="picker-hint"></span><span class="chev">▼</span></button>
      <div class="picker-pop" hidden><input type="search" placeholder="Type to filter…"><div class="picker-list"></div></div>`;
    this.btn = el.querySelector('.picker-btn'); this.label = el.querySelector('.picker-label'); this.hint = el.querySelector('.picker-hint');
    this.pop = el.querySelector('.picker-pop'); this.input = el.querySelector('input'); this.list = el.querySelector('.picker-list');
    this.btn.addEventListener('click', () => this.pop.hidden ? this.open() : this.close());
    this.input.addEventListener('input', () => { this.active = 0; this.render(); });
    this.input.addEventListener('keydown', (e) => {
      const n = this.filtered().length;
      if (e.key === 'ArrowDown') { this.active = Math.min(n - 1, this.active + 1); this.render(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { this.active = Math.max(0, this.active - 1); this.render(); e.preventDefault(); }
      else if (e.key === 'Enter') { const o = this.filtered()[this.active]; if (o) this.choose(o); e.preventDefault(); }
      else if (e.key === 'Escape') { this.close(); this.btn.focus(); }
    });
    document.addEventListener('click', (e) => { if (!el.contains(e.target)) this.close(); });
    this.renderLabel();
  }
  setOptions(opts, keep = true) {
    this.options = opts;
    if (!keep || !opts.some((o) => o.value === this.value)) this.value = null;
    this.btn.disabled = opts.length === 0 && !this.custom;
    this.renderLabel(); this.render();
  }
  set(value, silent = false) {

    }
    this.value = value; this.renderLabel(); if (!silent) this.onChange(value); return true;
  }
  current() { return this.options.find((o) => o.value === this.value) || null; }

    const f = q ? this.options.filter((o) => (o.label + ' ' + (o.hint || '')).toLowerCase().includes(q.toLowerCase())) : this.options.slice();
    if (this.custom && q && !this.options.some((o) => o.value === q)) f.push({ ...this.custom(q), isCustom: true });
    return f;
  }
  open() { if (this.btn.disabled) return; this.pop.hidden = false; this.el.classList.add('open'); this.input.value = ''; this.active = Math.max(0, this.options.findIndex((o) => o.value === this.value)); this.render(); this.input.focus(); }
  close() { this.pop.hidden = true; this.el.classList.remove('open'); }
  choose(o) { if (o.isCustom) this.options = this.options.concat([{ ...o, isCustom: false }]); this.value = o.value; this.renderLabel(); this.close(); this.onChange(o.value); }
  render() {
    const f = this.filtered();
    this.list.innerHTML = f.length ? f.map((o, i) => `<div class="picker-item${i === this.active ? ' active' : ''}${o.isCustom ? ' custom' : ''}" data-i="${i}"><span>${o.isCustom ? 'Use “' + esc(o.label) + '”' : esc(o.label)}</span><span class="hint">${esc(o.hint || '')}</span></div>`).join('') : '<div class="picker-empty">No match</div>';
    this.list.querySelectorAll('.picker-item').forEach((n) => n.addEventListener('click', () => this.choose(f[+n.dataset.i])));

  }
  renderLabel() {
    const o = this.current();
    this.label.textContent = o ? o.label : this.placeholder; this.hint.textContent = o ? (o.hint || '') : '';
    this.btn.classList.toggle('empty', !o);
  }
}

/* ---------- state & pickers ---------- */
const state = { refs: null, dstKind: 'service', edges: [], focus: null, policies: [], coverage: null, pKind: '', pFocus: null, pSelected: null };
const nsOf = (name) => state.refs?.namespaces.find((n) => n.name === name);
const hostOpt = (v) => ({ value: v, label: v, hint: /^[0-9.\/:]+$/.test(v) ? 'address' : 'host' });

const srcNs = new Picker($('#srcNs'), { placeholder: 'Namespace', onChange: () => { fillSrcWl(); syncCli(); } });
const srcWl = new Picker($('#srcWl'), { placeholder: 'Workload', onChange: syncCli });
const dstNs = new Picker($('#dstNs'), { placeholder: 'Namespace', onChange: () => { fillDstName(); syncCli(); } });
const dstName = new Picker($('#dstName'), { placeholder: 'Service', onChange: () => { fillDstPort(); syncCli(); }, custom: hostOpt });
const dstPort = new Picker($('#dstPort'), { placeholder: 'any', onChange: syncCli, custom: portOpt });
const pNs = new Picker($('#pNs'), { placeholder: 'All namespaces', onChange: () => renderPolicies() });

const wlOptions = (ns) => (ns ? ns.workloads : []).map((w) => ({ value: `${w.kind}/${w.name}`, label: `${w.kind}/${w.name}`, hint: `${w.pods} pod${w.pods === 1 ? '' : 's'}`, w }));
function fillSrcWl() { srcWl.setOptions(wlOptions(nsOf(srcNs.value))); if (srcWl.options.length === 1) srcWl.set(srcWl.options[0].value, true); }
function fillDstName() {
  const kind = state.dstKind;
  $('#dstNsField').style.display = kind === 'internet' ? 'none' : '';
  $('#dstNameLabel').textContent = { service: 'Service', workload: 'Workload', internet: 'Host' }[kind];
  dstName.placeholder = kind === 'internet' ? 'Any host, or type one' : $('#dstNameLabel').textContent;
  dstName.custom = kind === 'internet' ? hostOpt : null;
  let opts;
  if (kind === 'internet') {
    opts = [{ value: 'internet', label: 'Any host (the internet)', hint: '' }].concat((state.refs?.externals || []).map((x) => ({ ...hostOpt(x), hint: 'in a policy' })));
  } else {
    const ns = nsOf(dstNs.value);
    opts = kind === 'service'
      ? (ns ? ns.services : []).map((s) => ({ value: s.name, label: s.name, hint: s.type === 'ExternalName' ? 'ExternalName' : (s.ports.map((p) => p.port).join(', ') || s.type), s }))
      : wlOptions(ns);
  }
  dstName.setOptions(opts);
  if (kind === 'internet' && !dstName.value) dstName.set('internet', true);
  else if (opts.length === 1) dstName.set(opts[0].value, true);
  fillDstPort();
}
function fillDstPort() {
  const o = dstName.current();
  let opts = [{ value: '', label: 'any port', hint: '' }];
  if (o && o.s) opts = opts.concat(o.s.ports.map((p) => ({ value: String(p.port), label: `${p.port}/${p.protocol}${p.name ? ' (' + p.name + ')' : ''}`, hint: `→ ${p.targetPort}` })));
  if (o && o.w) opts = opts.concat(o.w.ports.map((p) => ({ value: String(p), label: String(p), hint: 'container port' })));
  if (state.dstKind === 'internet') opts = opts.concat([443, 80, 53].map((p) => ({ value: String(p), label: String(p), hint: '' })));
  dstPort.custom = state.dstKind === 'internet' ? portOpt : null;
  dstPort.setOptions(opts);
  if (opts.length === 2) dstPort.set(opts[1].value, true); else if (!dstPort.value) dstPort.set('', true);
}
function refsOf() {
  const src = srcNs.value && srcWl.value ? `${srcNs.value}/${srcWl.value}` : '';
  const dst = state.dstKind === 'internet' ? (dstName.value || '') : (dstNs.value && dstName.value ? `${dstNs.value}/${dstName.value}` : '');
  return { src, dst, port: dstPort.value || '' };
}
function syncCli() {
  const { src, dst, port } = refsOf();
  $('#cli').textContent = `kubectl netpol-map path ${src || '<source>'} ${dst || '<destination>'}${port ? ':' + port : ''}${state.dstKind === 'internet' && dst && dst !== 'internet' && !/^[0-9.\/]+$/.test(dst) ? ' --resolve-fqdn' : ''}`;
  $('#run').disabled = !(src && dst);
}

/* ---------- data ---------- */
async function api(url) {
  const r = await fetch(url);
  const body = await r.json().catch(() => ({ error: `${r.status} ${r.statusText}` }));
  if (!r.ok) throw new Error(body.error || `${r.status} ${r.statusText}`);
  return body;
}
async function loadRefs(refresh = false) {
  const btn = $('#refresh'); btn.disabled = true; btn.querySelector('span').textContent = 'Loading…';
  try {
    state.refs = await api('/api/refs' + (refresh ? '?refresh=1' : ''));
    state.loadedAt = Date.now();
    $('#ctx').innerHTML = `context <b>${esc(state.refs.context || '—')}</b>`;
    $('#stats').textContent = `${state.refs.namespaces.length} namespaces · ${state.refs.podCount} pods · ${state.refs.policyCount} policies${state.refs.meshFetched ? '' : ' · mesh not read'}`;
    const nsOpts = state.refs.namespaces.map((n) => ({ value: n.name, label: n.name, hint: `${n.workloads.length} wl · ${n.services.length} svc` }));
    srcNs.setOptions(nsOpts); dstNs.setOptions(nsOpts);
    pNs.setOptions([{ value: '', label: 'All namespaces' }].concat(nsOpts)); if (!pNs.value) pNs.set('', true);
    fillSrcWl(); fillDstName(); syncCli();
    $('#traceError').innerHTML = '';
    await loadPolicies();
  } catch (e) {
    $('#traceError').innerHTML = $('#policiesError').innerHTML = `<div class="error">Could not read the cluster: ${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.querySelector('span').textContent = 'Refresh'; }
}

/* ---------- policies: overview map ---------- */
async function loadPolicies() {
  const [r, findings] = await Promise.all([api('/api/policies'), api('/api/lint').catch(() => [])]);
  state.policies = r.policies; state.coverage = r.coverage; state.findings = findings; state.pFocus = null; state.denies = null;
  if (state.pSelected && !state.policies.some((p) => p.key === state.pSelected)) state.pSelected = null;
  renderPolicies();
}
function visiblePolicies() {
  const q = ($('#pSearch').value || '').toLowerCase();
  return state.policies.filter((p) => (!state.pKind || p.kind.startsWith(state.pKind)) && (!q || [p.key, p.selector, ...p.selected.map(keyOf), ...[...p.ingress, ...p.egress].flatMap((r) => r.peers.flatMap((x) => [x.label, ...(x.matches || []).map(keyOf)]))].join(' ').toLowerCase().includes(q)));
}
function renderPolicies() {
  const cov = state.coverage; const vis = visiblePolicies();
  const unprotected = cov.unprotected.length; const rejected = state.policies.filter((p) => p.rejected);
  $('#pChips').innerHTML = `
    <span class="pill"><b>${state.policies.length}</b> policies</span>
    <span class="pill accent"><b>${cov.isolatedIngress}</b> workloads ingress-isolated</span>
    <span class="pill accent"><b>${cov.isolatedEgress}</b> egress-isolated</span>
    <span class="pill ${unprotected ? 'warn' : 'ok'} click" id="pUnprot" title="click to list"><b>${unprotected}</b> of ${cov.workloads} workloads touched by no policy (default-allow)</span>
    ${state.denies && !state.denies.loading ? `<span class="pill fail"><b>${state.denies.edges.length}</b> denied workload pairs${showing().has('deny') ? '' : ' (hidden: tick “denied”)'}</span>` : ''}
    ${state.findings.length ? `<span class="pill ${state.findings.some((f) => f.Severity !== 'info') ? 'warn' : ''} click" id="pLint" title="click to list"><b>${state.findings.length}</b> lint finding${state.findings.length === 1 ? '' : 's'}</span>` : ''}
    ${rejected.length ? `<span class="pill fail click" id="pRejected" title="click to list"><b>${rejected.length}</b> polic${rejected.length === 1 ? 'y' : 'ies'} rejected by Cilium, not enforced</span>` : ''}
    ${vis.length !== state.policies.length ? `<span class="pill">${vis.length} shown</span>` : ''}
    ${pNs.value ? `<span class="pill accent">namespace ${esc(pNs.value)} and its peers</span>` : ''}`;
  $('#pRejected')?.addEventListener('click', () => {
    $('#pDetail').innerHTML = `<h3>Rejected by Cilium — not enforced</h3>${rejected.map((p) => `<div class="finding error"><span class="mono"><a href="#" data-p="${esc(p.key)}">${esc(p.key)}</a></span><div>${esc(p.rejected)}</div></div>`).join('')}`;
    $('#pDetail').querySelectorAll('[data-p]').forEach((a) => a.addEventListener('click', (ev) => { ev.preventDefault(); selectPolicy(a.dataset.p); }));
  });
  $('#pLint')?.addEventListener('click', () => {
    $('#pDetail').innerHTML = `<h3>Lint findings</h3>${findingsHTML(state.findings)}`;
  });
  $('#pUnprot').addEventListener('click', () => {
    $('#pDetail').innerHTML = `<h3>Workloads no policy selects — all traffic allowed</h3>${cov.unprotected.length ? cov.unprotected.map((w) => `<div class="center" style="border-width:1px;border-color:var(--warn);margin-bottom:6px;padding:6px 10px"><span class="mono">${esc(keyOf(w))}</span> <span class="badge">${w.pods} pods</span></div>`).join('') : '<div class="empty">Every workload is selected by at least one policy.</div>'}`;
  });
  renderPolicyMap(vis); renderPolicyList(vis);
  if (state.pSelected) renderPolicyDetail(state.policies.find((p) => p.key === state.pSelected));
}
// Evaluated verdicts that are not ALLOW, overlaid on the intent map. Loaded
// once per namespace filter; the policy map re-renders when they arrive.
const deniesKey = () => `${pNs.value || '*'}:${$('#pPort').value || ''}`;
async function loadDenies() {
  const ns = pNs.value, key = deniesKey(), port = `port=${encodeURIComponent($('#pPort').value || '')}`;
  if (state.denies && state.denies.key === key) return;
  const urls = ns ? [`/api/matrix?from=${encodeURIComponent(ns)}&${port}`, `/api/matrix?to=${encodeURIComponent(ns)}&${port}`] : [`/api/matrix?${port}`];
  state.denies = { key, edges: [], loading: true };
  try {
    const seen = new Set(); const edges = [];
    for (const r of await Promise.all(urls.map(api))) r.edges.forEach((e) => { const k = keyOf(e.from) + '|' + keyOf(e.to); if (e.status !== 'allow' && !seen.has(k)) { seen.add(k); edges.push(e); } });
    state.denies = { key, edges };
  } catch (e) { state.denies = { key, edges: [], error: e.message }; }
  renderPolicies();
}
function buildPolicyGraph(policies) {
  const nodes = new Map(); const extIn = new Map(); const extOut = new Map(); const edges = new Map();
  state.refs.namespaces.forEach((n) => n.workloads.forEach((w) => { const k = `${n.name}/${w.kind}/${w.name}`; nodes.set(k, { key: k, ns: n.name, kind: w.kind, name: w.name, I: false, E: false, touched: false }); }));
  const ensure = (a) => { const k = keyOf(a); if (!nodes.has(k)) nodes.set(k, { key: k, ...a, I: false, E: false, touched: false }); return nodes.get(k); };
  const showExt = $('#pExt').checked;
  const extNode = (store, peer, prefix) => { if (!showExt) return null; const k = prefix + peer.label; if (!store.has(k)) store.set(k, { key: k, kind: peer.type, name: peer.label, ext: true }); return store.get(k); };
  // Port filter: a rule counts when it covers the port ("any", the number,
  // a range) or names a port we could not resolve.
  const want = parseInt($('#pPort').value, 10);
  const portOK = (ports) => !want || ports.some((p) => { const [v] = p.split('/'); if (v === 'any') return true; const [lo, hi] = v.split('-').map(Number); return isNaN(lo) || (hi ? want >= lo && want <= hi : want === lo); });
  const addEdge = (a, b, p, rule, dir) => {
    if (!a || !b || !portOK(rule.ports)) return;
    const status = p.rejected ? 'rejected' : rule.deny ? 'deny' : 'allow';
    const k = `${a.key}|${b.key}|${status}`;
    if (!edges.has(k)) edges.set(k, { a: a.key, b: b.key, status, lines: [] });
    edges.get(k).lines.push(`${p.kind === 'NetworkPolicy' ? 'NP' : p.kind === 'CiliumNetworkPolicy' ? 'CNP' : 'CCNP'} ${p.namespace ? p.namespace + '/' : ''}${p.name} · ${dir} · ${rule.ports.join(', ')}${rule.l7 ? ' · L7' : ''}${p.rejected ? ' · NOT ENFORCED, rejected by Cilium' : ''}`);
  };
  policies.forEach((p) => {
    // A policy Cilium rejected is drawn in grey as intent only: it opens and
    // isolates nothing.
    const sel = p.selected.map(ensure);
    sel.forEach((n) => { n.touched = n.touched || !p.rejected; n.I = n.I || p.isolatesIngress; n.E = n.E || p.isolatesEgress; });
    p.ingress.forEach((rule) => rule.peers.forEach((peer) => {
      const srcs = peer.type === 'pods' || peer.type === 'namespace' ? (peer.matches || []).map(ensure) : [extNode(extIn, peer, 'in:')];
      srcs.forEach((s) => sel.forEach((t) => addEdge(s, t, p, rule, 'ingress')));
    }));
    p.egress.forEach((rule) => rule.peers.forEach((peer) => {
      const dsts = peer.type === 'pods' || peer.type === 'namespace' ? (peer.matches || []).map(ensure) : [extNode(extOut, peer, 'out:')];
      sel.forEach((s) => dsts.forEach((t) => addEdge(s, t, p, rule, 'egress')));
    }));
  });
  // Overlay what the evaluator says is not allowed: a pair that a rule opens
  // but the other side blocks turns amber; a pair no rule opens turns red.
  if (needsEval() && state.denies && !state.denies.loading) {
    state.denies.edges.forEach((d) => {
      const a = ensure(d.from), b = ensure(d.to);
      const line = `evaluated: ${d.verdict} — ${d.reason}`;
      const intent = edges.get(`${a.key}|${b.key}|allow`);
      if (intent) { intent.status = d.status === 'deny' ? 'blocked' : d.status; intent.lines.push(line); return; }
      const k = `${a.key}|${b.key}|eval`;
      if (!edges.has(k)) edges.set(k, { a: a.key, b: b.key, status: d.status, lines: [line], from: d.from, to: d.to });
    });
  }
  // Edge-type filter from the legend checkboxes.
  const show = showing();
  const kind = (s) => s === 'partial' || s === 'unknown' ? 'uncertain' : s;
  let kept = [...edges.values()].filter((e) => show.has(kind(e.status)));
  // Namespace filter: keep that namespace's workloads, every edge touching
  // them, and the peers on the other end of those edges.
  const ns = pNs.value;
  if (ns) {
    const keep = new Set([...nodes.values()].filter((n) => n.ns === ns).map((n) => n.key));
    kept = kept.filter((e) => keep.has(e.a) || keep.has(e.b));
    kept.forEach((e) => { keep.add(e.a); keep.add(e.b); });
    return { nodes: new Map([...nodes].filter(([k]) => keep.has(k))), extIn: [...extIn.values()].filter((n) => keep.has(n.key)), extOut: [...extOut.values()].filter((n) => keep.has(n.key)), edges: kept };
  }
  return { nodes, extIn: [...extIn.values()], extOut: [...extOut.values()], edges: kept };
}
const showing = () => new Set([...document.querySelectorAll('#pShow input:checked')].map((i) => i.value));
// Evaluated verdicts are only needed when a non-allow edge type is shown.
const needsEval = () => { const s = showing(); return s.has('deny') || s.has('blocked') || s.has('uncertain'); };
/* zoom + export, shared by both maps */
document.querySelectorAll('.zoom').forEach((z) => z.addEventListener('input', () => { const svg = $('#' + z.dataset.map + ' svg'); if (svg) svg.style.zoom = z.value / 100; }));
document.querySelectorAll('[data-dl]').forEach((b) => b.addEventListener('click', () => downloadSVG(b.dataset.dl)));
function downloadSVG(mapId) {
  const svg = $('#' + mapId + ' svg'); if (!svg) return;

  svg.setAttribute('width', box.width); svg.setAttribute('height', d.scrollHeight);
  svg.innerHTML = `<defs>${['allow', 'deny'].map((s) => `<marker id="carr-${s}" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="${edgeColor(s)}"/></marker>`).join('')}</defs>${paths.join('')}${stubs.join('')}`;
}

/* ---------- trace ---------- */
async function runTrace() {
  const { src, dst, port } = refsOf();
  if (!src || !dst) return;
  const btn = $('#run'); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Tracing…';
  $('#traceError').innerHTML = '';
  history.replaceState(null, '', `?src=${encodeURIComponent(src)}&dst=${encodeURIComponent(dst)}${port ? '&port=' + encodeURIComponent(port) : ''}&kind=${state.dstKind}`);
  try {
    renderTrace(await api(`/api/path?src=${encodeURIComponent(src)}&dst=${encodeURIComponent(dst)}&port=${encodeURIComponent(port)}`));
  } catch (e) {
    $('#traceResult').innerHTML = '';
    $('#traceError').innerHTML = `<div class="error">${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = 'Trace connection'; }
}
function renderTrace(r) {
  const via = r.external ? `outside the cluster: ${r.external} (static check; assumes outbound NAT)` : r.service ? `Service ${r.service.Namespace}/${r.service.Name} → ${r.dstPods.length} pod(s)` : `${r.dstPods.length} pod(s)`;
  const sub = `${r.srcPods.length} source pod(s) → ${via}${r.targetPort && !r.external ? ` · policy evaluated at pod port ${r.targetPort}` : ''}`;
  const layers = r.layers.map((l) => `
    <div class="layer ${l.status}">
      <div class="g ${l.status}">${GLYPH[l.status] || '?'}</div>
      <div class="n">${esc(l.name)}</div>
      <div class="s">${esc(l.summary)}${(l.detail || []).map((d) => `<div class="d">${esc(d)}</div>`).join('')}${l.fix ? `<div class="fix"><b>How to fix</b>${esc(l.fix)}</div>` : ''}</div>
    </div>`).join('');
  const pairs = (r.pairs || []).length > 1 ? `<details><summary>NetworkPolicy per pod pair (${r.pairs.length})</summary><table><tr><th>Source</th><th>Destination</th><th>Verdict</th><th>Reason</th></tr>${r.pairs.map((p) => {
      const st = p.unknown ? 'unknown' : p.allowed ? 'ok' : 'fail';
      const v = p.unknown ? 'UNKNOWN' : p.allowed ? 'ALLOW' + (p.ports && !(p.ports.length === 1 && p.ports[0] === '*') ? ' :' + p.ports.join(',') : '') : 'DENY';
      return `<tr><td class="mono">${esc(p.src)}</td><td class="mono">${esc(p.dst)}</td><td><span class="pill ${st}">${esc(v)}</span></td><td>${esc(p.reason)}</td></tr>`;
    }).join('')}</table></details>` : '';
  $('#traceResult').innerHTML = `
    <div class="verdict ${r.status}"><div class="glyph">${GLYPH[r.status]}</div><div><div class="big">${esc(r.verdict)}</div><div class="sub">${esc(sub)}</div></div></div>
    <div class="card"><div class="layers">${layers}</div>${pairs}</div>`;
}

/* ---------- connections table under the policy map ---------- */
const axisOf = (key) => { const [ns, kind, ...name] = key.split('/'); return { ns, kind, name: name.join('/') }; };
const isWorkloadKey = (key) => !/^(in|out):/.test(key);
function renderPolicyFlows(edges) {
  const label = { allow: 'ALLOWED', deny: 'DENIED', blocked: 'RULE EXISTS, STILL DENIED', partial: 'PARTIAL', unknown: 'UNKNOWN', rejected: 'NOT ENFORCED' };
  const focus = state.pFocus;
  const rows = edges.map((e, i) => ({ e, i })).filter(({ e }) => !focus || e.a === focus || e.b === focus);
  $('#pflowsSummary').textContent = `Connections drawn (${rows.length}${focus ? ', focused on ' + focus : ''})`;
  $('#pflowsBody').innerHTML = rows.length ? `<table><tr><th>Source</th><th>Destination</th><th>Verdict</th><th>Why</th><th></th></tr>${rows.map(({ e, i }) => `
    <tr data-i="${i}"><td class="mono">${esc(e.a.replace(/^(in|out):/, ''))}</td><td class="mono">${esc(e.b.replace(/^(in|out):/, ''))}</td>
    <td><span class="pill ${PILL[e.status]}">${label[e.status]}</span></td><td class="mono" style="font-size:12px">${e.lines.map(esc).join('<br>')}</td>
    <td>${isWorkloadKey(e.a) && isWorkloadKey(e.b) ? `<button class="btn small" data-trace="${i}">Trace →</button>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">Nothing drawn with the current filters.</div>';
  $('#pflowsBody').querySelectorAll('[data-trace]').forEach((b) => b.addEventListener('click', () => { const e = edges[+b.dataset.trace]; traceEdge({ from: axisOf(e.a), to: axisOf(e.b) }); }));
}
function traceEdge(e) {
  srcNs.set(e.from.ns, true); fillSrcWl(); srcWl.set(`${e.from.kind}/${e.from.name}`, true);
  setKind('workload'); dstNs.set(e.to.ns, true); fillDstName(); dstName.set(`${e.to.kind}/${e.to.name}`, true); fillDstPort(); dstPort.set($('#pPort').value || '', true);
  syncCli(); showTab('trace'); runTrace();
}

/* ---------- wiring ---------- */
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('active', p.id === 'panel-' + name));
  if (name === 'policies' && state.pSelected) requestAnimationFrame(() => drawConnectors($('#pDetail')));
}
function setKind(kind) {
  state.dstKind = kind;
  $('#dstKind').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b.dataset.kind === kind));
  fillDstName(); syncCli();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => showTab(t.dataset.tab)));
$('#dstKind').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => setKind(b.dataset.kind)));
$('#pKind').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { state.pKind = b.dataset.k; $('#pKind').querySelectorAll('button').forEach((x) => x.classList.toggle('active', x === b)); renderPolicies(); }));
$('#pSearch').addEventListener('input', renderPolicies);
$('#pExt').addEventListener('change', renderPolicies);
$('#pShow').addEventListener('change', renderPolicies);
// Re-read the cluster when the tab comes back into view after a while, so a
// manifest applied in a terminal shows up without pressing Refresh.
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.refs && Date.now() - state.loadedAt > 30000) loadRefs(true); });
$('#run').addEventListener('click', runTrace);
$('#pPort').addEventListener('input', renderPolicies);
$('#refresh').addEventListener('click', () => loadRefs(true));
$('#copy').addEventListener('click', () => navigator.clipboard.writeText($('#cli').textContent).then(() => { $('#copy').textContent = 'Copied'; setTimeout(() => ($('#copy').textContent = 'Copy'), 1200); }));
$('#theme').addEventListener('click', () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('netpol-map-theme', document.documentElement.dataset.theme); } catch {}
});
window.addEventListener('resize', () => { if (state.pSelected) drawConnectors($('#pDetail')); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.target.closest('.picker') && e.target.tagName !== 'INPUT' && $('#panel-trace').classList.contains('active')) runTrace(); });
try { const t = localStorage.getItem('netpol-map-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

// Restore a trace from the URL once refs are loaded.
loadRefs().then(() => {
  const p = new URLSearchParams(location.search);
  const src = p.get('src'), dst = p.get('dst');
  if (!src || !dst) return;
  const [sn, ...sr] = src.split('/');
  srcNs.set(sn, true); fillSrcWl(); srcWl.set(sr.join('/'), true);
  if (p.get('kind') === 'internet') { setKind('internet'); dstName.set(dst, true); }
  else { const [dn, ...dr] = dst.split('/'); setKind(dr.length > 1 ? 'workload' : 'service'); dstNs.set(dn, true); fillDstName(); dstName.set(dr.join('/'), true); }
  fillDstPort(); dstPort.set(p.get('port') || '', true); syncCli();
  if (srcWl.value && dstName.value) { showTab('trace'); runTrace(); }
});
</script>
</body>
</html>
