# Cilium additions to demo.yaml, for clusters that run Cilium. They show the
# patterns teams use on top of (or instead of) native policies:
#
#   - DNS-aware egress: the worker may reach api.stripe.com and *.amazonaws.com
#     only, with a DNS L7 rule so Cilium can learn the IPs
#   - an explicit cluster-wide deny of the cloud metadata endpoint, without
#     putting every pod into default-deny (a deny-only policy does that too,
#     unless enableDefaultDeny says otherwise)
#
# Cilium enforces these together with demo.yaml's standard policies from one
# pool: a rule of either kind opens traffic. worker-egress already opens
# 443 to any public address, so the FQDN rule adds names, it does not
# restrict them; remove worker-egress to see the names-only behaviour.
#
# Expected verdicts (Cilium cluster, with demo.yaml applied):
#   shop/worker -> api.stripe.com:443 --resolve-fqdn   REACHABLE (toFQDNs and worker-egress)
#   shop/worker -> example.com:443    --resolve-fqdn   REACHABLE (worker-egress ipBlock)
#   any pod     -> 169.254.169.254                     BLOCKED at Egress policy (egressDeny)
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: worker-fqdn-egress
  namespace: shop
spec:
  endpointSelector:
    matchLabels:
      app: worker
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.stripe.com
        - matchPattern: "*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
